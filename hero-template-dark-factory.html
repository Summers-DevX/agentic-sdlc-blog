<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Engineering: The Agentic SDLC - Hero Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .hero-container {
            width: 1200px;
            height: 700px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background elements */
        .bg-blur {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            filter: blur(80px);
        }

        .blur-1 {
            width: 400px;
            height: 400px;
            background: #ff006e;
            top: -100px;
            left: -100px;
            animation: float 15s ease-in-out infinite;
        }

        .blur-2 {
            width: 300px;
            height: 300px;
            background: #00d4ff;
            bottom: -50px;
            right: -50px;
            animation: float 12s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }

        .left-content {
            flex: 1;
            z-index: 2;
            max-width: 500px;
        }

        .profile-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 30px;
        }

        .profile-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 0, 110, 0.3) 0%, rgba(0, 212, 255, 0.2) 70%, transparent 100%);
            border-radius: 50%;
            top: 0;
            left: 0;
            filter: blur(30px);
            z-index: 1;
        }

        .profile-image {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(0, 212, 255, 0.3);
            z-index: 2;
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.4), 0 0 60px rgba(0, 212, 255, 0.2);
        }

        .title {
            font-size: 64px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .title-primary {
            color: #00d4ff;
            display: block;
        }

        .title-secondary {
            color: #ff006e;
            display: block;
        }

        .subtitle {
            font-size: 18px;
            color: #b0b0b0;
            margin-bottom: 40px;
            line-height: 1.6;
            font-weight: 400;
        }

        .series-badge {
            display: inline-block;
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cta-text {
            font-size: 14px;
            color: #888;
        }

        .right-content {
            flex: 1;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        svg {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.2));
        }

        .logo {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 3;
            font-size: 12px;
            color: #888;
            font-weight: 600;
        }

        .logo-text {
            color: #00d4ff;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .hero-container {
                flex-direction: column;
                height: auto;
                padding: 40px;
            }

            .left-content {
                margin-bottom: 40px;
            }

            .title {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <!-- Background blur elements -->
        <div class="bg-blur blur-1"></div>
        <div class="bg-blur blur-2"></div>

        <!-- Logo -->
        <div class="logo">
            <span class="logo-text">OutSystems</span><br>Engineering
        </div>

        <!-- Left Content -->
        <div class="left-content">
            <!-- Profile Image with glow effect -->
            <div class="profile-wrapper">
                <div class="profile-glow"></div>
                <img src="profile.jpg" alt="Author" class="profile-image" />
            </div>

            <div class="series-badge">3-Part Series</div>
            <h1 class="title">
                <span class="title-primary">The Agentic</span>
                <span class="title-secondary">SDLC</span>
            </h1>
            <p class="subtitle">Why your current software development lifecycle is dead—and what replaces it when agents operate at machine speed.</p>
            <p class="cta-text">Read all three parts • 15 minutes</p>
        </div>

        <!-- Right Content: Dark Factory Diagram -->
        <div class="right-content">
            <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
                <!-- Central agent orchestrator -->
                <circle cx="150" cy="80" r="35" fill="none" stroke="#00d4ff" stroke-width="2"/>
                <circle cx="150" cy="80" r="30" fill="rgba(0, 212, 255, 0.05)"/>
                <text x="150" y="85" text-anchor="middle" fill="#00d4ff" font-size="11" font-weight="bold">AGENT</text>

                <!-- Connecting lines to components -->
                <line x1="130" y1="110" x2="80" y2="160" stroke="rgba(255, 0, 110, 0.3)" stroke-width="2" stroke-dasharray="5,5"/>
                <line x1="150" y1="115" x2="150" y2="170" stroke="rgba(0, 212, 255, 0.3)" stroke-width="2" stroke-dasharray="5,5"/>
                <line x1="170" y1="110" x2="220" y2="160" stroke="rgba(255, 0, 110, 0.3)" stroke-width="2" stroke-dasharray="5,5"/>

                <!-- Left: Code Component -->
                <rect x="50" y="160" width="60" height="50" rx="4" fill="none" stroke="#ff006e" stroke-width="2"/>
                <text x="80" y="175" text-anchor="middle" fill="#ff006e" font-size="10" font-weight="bold">CODE</text>
                <text x="80" y="200" text-anchor="middle" fill="#888" font-size="8">Generation</text>

                <!-- Center: Compliance Component -->
                <rect x="120" y="170" width="60" height="50" rx="4" fill="none" stroke="#00d4ff" stroke-width="2"/>
                <text x="150" y="185" text-anchor="middle" fill="#00d4ff" font-size="10" font-weight="bold">POLICY</text>
                <text x="150" y="210" text-anchor="middle" fill="#888" font-size="8">Enforcement</text>

                <!-- Right: Observability Component -->
                <rect x="190" y="160" width="60" height="50" rx="4" fill="none" stroke="#ff006e" stroke-width="2"/>
                <text x="220" y="175" text-anchor="middle" fill="#ff006e" font-size="10" font-weight="bold">M&O</text>
                <text x="220" y="200" text-anchor="middle" fill="#888" font-size="8">Feedback</text>

                <!-- Bottom layer: Three execution flows -->
                <g opacity="0.8">
                    <!-- Flow 1 -->
                    <rect x="30" y="280" width="55" height="40" rx="4" fill="none" stroke="rgba(0, 212, 255, 0.4)" stroke-width="1.5"/>
                    <text x="57.5" y="301" text-anchor="middle" fill="rgba(0, 212, 255, 0.7)" font-size="9">Deploy</text>

                    <!-- Flow 2 -->
                    <rect x="122.5" y="280" width="55" height="40" rx="4" fill="none" stroke="rgba(0, 212, 255, 0.4)" stroke-width="1.5"/>
                    <text x="150" y="301" text-anchor="middle" fill="rgba(0, 212, 255, 0.7)" font-size="9">Monitor</text>

                    <!-- Flow 3 -->
                    <rect x="215" y="280" width="55" height="40" rx="4" fill="none" stroke="rgba(0, 212, 255, 0.4)" stroke-width="1.5"/>
                    <text x="242.5" y="301" text-anchor="middle" fill="rgba(0, 212, 255, 0.7)" font-size="9">Iterate</text>
                </g>

                <!-- Context Lake indicator -->
                <ellipse cx="150" cy="370" rx="80" ry="15" fill="none" stroke="rgba(255, 0, 110, 0.2)" stroke-width="2" stroke-dasharray="3,3"/>
                <text x="150" y="375" text-anchor="middle" fill="#888" font-size="10">Context Lake</text>

                <!-- Connecting lines from flows to context lake -->
                <line x1="57.5" y1="320" x2="120" y2="355" stroke="rgba(255, 0, 110, 0.15)" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="150" y1="320" x2="150" y2="355" stroke="rgba(255, 0, 110, 0.15)" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="242.5" y1="320" x2="180" y2="355" stroke="rgba(255, 0, 110, 0.15)" stroke-width="1" stroke-dasharray="3,3"/>
            </svg>
        </div>
    </div>
</body>
</html>
